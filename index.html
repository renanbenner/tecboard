<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecboard</title>
    <link rel="icon" href="favicon-tecboard-dark.svg" type="image/svg+xml">
    <link href="./styles/reset.css" rel="stylesheet">
    <link href="./styles/styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <div><img src="./img/logo-tecboard-dark.webp" alt="Logo da Tecboard" class="cabecalho"></div>
        <div><img src="./img/Modos.svg" alt="Botão para alterar o modo de dark para light" class="cabecalho"></div>
    </header>
    <main>
        <section class="tela-inicial">
            <h1 class="tela-inicial-titulo">
                <span>Fique de olho</span>
                <br>no que importa
            </h1>
            <p class="tela-inicial-texto">Monitoramento em tempo real com alertas inteligentes para sua aplicação nunca sair do ar sem você saber.</p>
            <a href="#" class="tela-inicial-botao">Testar versão demo</a>
            <img src="./img/celulares-sobrepostos.png" alt="Dois celulares pretos sobrepostos com uma sombra roxa sob eles" class="tela-inicial-imagem">
        </section>
    </main>
</body>
</html>
